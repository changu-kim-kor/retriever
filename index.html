<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>안내견 리트리버 성격 테스트</title>
    <style>
        * { box-sizing: border-box; font-family: 'Pretendard', sans-serif; }
        body { background: #fdf8ed; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: white; width: 100%; max-width: 480px; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); text-align: center; }
        .hidden { display: none; }
        h1 { color: #d97706; font-size: 22px; margin-bottom: 20px; }
        .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; border: 2px solid #fef3c7; background: #fffbeb; border-radius: 12px; cursor: pointer; font-weight: 600; color: #92400e; font-size: 15px; transition: all 0.2s; }
        .btn:hover { background: #fde68a; border-color: #f59e0b; }
        .progress { background: #f3f4f6; height: 10px; border-radius: 5px; margin-bottom: 20px; overflow: hidden; }
        .bar { background: #f59e0b; height: 100%; width: 0%; transition: width 0.3s; }
        .result-type { font-size: 24px; font-weight: bold; color: #b45309; margin: 15px 0 5px; }
    </style>
</head>
<body>

<div class="card">
    <!-- 시작 화면 -->
    <div id="start-page">
        <h1>🦮 나의 안내견 리트리버 유형은?</h1>
        <p>몇 가지 간단한 질문으로 나와 닮은 안내견 성격을 알아보세요!</p>
        <button class="btn" style="background:#f59e0b; color:white; border:none;" onclick="startQuiz()">테스트 시작하기</button>
    </div>

    <!-- 질문 화면 -->
    <div id="quiz-page" class="hidden">
        <div class="progress"><div id="bar" class="bar"></div></div>
        <h2 id="question" style="font-size: 18px; color: #374151; min-height: 50px;">질문 내용</h2>
        <button class="btn" onclick="selectOption('A')" id="optA">선택지 A</button>
        <button class="btn" onclick="selectOption('B')" id="optB">선택지 B</button>
    </div>

    <!-- 결과 화면 -->
    <div id="result-page" class="hidden">
        <h1>🐾 테스트 결과</h1>
        <div id="result-type" class="result-type">결과 유형</div>
        <p id="result-desc" style="color: #4b5563; line-height: 1.6;"></p>
        <button class="btn" style="background:#f59e0b; color:white; border:none; margin-top:20px;" onclick="location.reload()">다시 하기</button>
    </div>
</div>

<script>
    const questions = [
        {
            q: "산책 중 처음 보는 사람이 반갑게 인사를 건넬 때 당신은?",
            a: { text: "꼬리를 치며 반갑게 다가가 친해진다", type: "P" },
            b: { text: "주인의 보폭에 맞춰 차분히 걷는 데 집중한다", type: "I" }
        },
        {
            q: "새로운 장소나 미션을 만났을 때 당신의 반응은?",
            a: { text: "호기심을 가지고 구석구석 살핀다", type: "C" },
            b: { text: "배운 규칙대로 신중하고 차분하게 행동한다", type: "F" }
        },
        {
            q: "자유 시간이 생겼을 때 더 선호하는 행동은?",
            a: { text: "마당을 신나게 뛰어놀거나 활발하게 움직인다", type: "A" },
            b: { text: "주인 곁 편안한 장소에서 휴식을 취한다", type: "S" }
        }
    ];

    const results = {
        "P-C-A": { title: "호기심 에너자이저 리트리버", desc: "주변 환경에 관심이 많고 에너지가 넘치며, 사람들과 빠르게 친해지는 친화력 대장입니다!" },
        "I-F-S": { title: "베테랑 완벽주의 안내견", desc: "집중력이 뛰어난 베테랑 스타일! 맡은 임무와 규칙을 정확히 수행하는 든든한 파트너입니다." },
        "DEFAULT": { title: "다정다감한 온난화 리트리버", desc: "상황에 따라 차분함과 유쾌함을 유연하게 발휘하는 따뜻한 마음의 소유자입니다." }
    };

    let currentIdx = 0;
    let scores = [];

    function startQuiz() {
        document.getElementById('start-page').classList.add('hidden');
        document.getElementById('quiz-page').classList.remove('hidden');
        showQuestion();
    }

    function showQuestion() {
        const q = questions[currentIdx];
        document.getElementById('question').innerText = q.q;
        document.getElementById('optA').innerText = q.a.text;
        document.getElementById('optB').innerText = q.b.text;
        document.getElementById('bar').style.width = ((currentIdx / questions.length) * 100) + '%';
    }

    function selectOption(option) {
        const selected = questions[currentIdx][option.toLowerCase()].type;
        scores.push(selected);
        currentIdx++;

        if (currentIdx < questions.length) {
            showQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById('quiz-page').classList.add('hidden');
        document.getElementById('result-page').classList.remove('hidden');

        const key = scores.join('-');
        const result = results[key] || results["DEFAULT"];

        document.getElementById('result-type').innerText = result.title;
        document.getElementById('result-desc').innerText = result.desc;
    }
</script>
</body>
</html>
