<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>안내견 리트리버 성격 테스트</title>
    <style>
        * { box-sizing: border-box; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
        body { background: #fdf8ed; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: white; width: 100%; max-width: 480px; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); text-align: center; }
        .hidden { display: none; }
        h1 { color: #d97706; font-size: 22px; margin-bottom: 15px; }
        .sub-title { color: #6b7280; font-size: 14px; margin-bottom: 25px; line-height: 1.5; }
        .btn { display: block; width: 100%; padding: 16px; margin: 10px 0; border: 2px solid #fef3c7; background: #fffbeb; border-radius: 14px; cursor: pointer; font-weight: 600; color: #92400e; font-size: 15px; transition: all 0.2s; line-height: 1.4; }
        .btn:hover { background: #fde68a; border-color: #f59e0b; }
        .progress { background: #f3f4f6; height: 10px; border-radius: 5px; margin-bottom: 25px; overflow: hidden; }
        .bar { background: #f59e0b; height: 100%; width: 0%; transition: width 0.3s; }
        .result-type { font-size: 22px; font-weight: bold; color: #b45309; margin: 20px 0 10px; }
        .badge { display: inline-block; background: #fef3c7; color: #d97706; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="card">
    <!-- 1. 시작 화면 -->
    <div id="start-page">
        <div style="font-size: 50px; margin-bottom: 10px;">🦮</div>
        <h1>나의 안내견 리트리버 유형은?</h1>
        <p class="sub-title">9가지 질문을 통해 나와 가장 닮은<br>8가지 안내견 리트리버 성격을 찾아보세요!</p>
        <button class="btn" style="background:#f59e0b; color:white; border:none; font-size:16px;" onclick="startQuiz()">테스트 시작하기</button>
    </div>

    <!-- 2. 질문 화면 -->
    <div id="quiz-page" class="hidden">
        <div class="progress"><div id="bar" class="bar"></div></div>
        <div id="question-number" class="badge">질문 1 / 9</div>
        <h2 id="question" style="font-size: 18px; color: #1f2937; min-height: 55px; margin-top:0;">질문 내용</h2>
        <button class="btn" onclick="selectOption('A')" id="optA">선택지 A</button>
        <button class="btn" onclick="selectOption('B')" id="optB">선택지 B</button>
    </div>

    <!-- 3. 결과 화면 -->
    <div id="result-page" class="hidden">
        <div class="badge">YOUR TYPE</div>
        <h1>🐾 나의 리트리버 성격 결과</h1>
        <div id="result-type" class="result-type">결과 유형</div>
        <p id="result-desc" style="color: #4b5563; line-height: 1.6; font-size: 15px; word-break: keep-all;"></p>
        <button class="btn" style="background:#f59e0b; color:white; border:none; margin-top:25px;" onclick="resetQuiz()">다시 테스트하기</button>
    </div>
</div>

<script>
    // 질문 구조 (각 축당 3개씩 총 9문항)
    // Q1~Q3: 규칙(R) vs 유연(F)
    // Q4~Q6: 사람(P) vs 독립(I)
    // Q7~Q9: 에너지(E) vs 차분(C)
    const questions = [
        {
            q: "산책 중 길가에서 흥미로운 냄새나 장난감을 발견했을 때?",
            a: { text: "내 임무와 걸음에 집중하며 흔들림 없이 지나친다.", trait: "R" },
            b: { text: "호기심이 생겨 살짝 기웃거리며 관심 있게 살핀다.", trait: "F" }
        },
        {
            q: "복잡하거나 예상치 못한 장애물 상황을 만났을 때 대처법은?",
            a: { text: "배운 규칙과 안전 원칙에 따라 신중하게 행동한다.", trait: "R" },
            b: { text: "상황에 맞춰 부드럽고 유연하게 우회로를 찾는다.", trait: "F" }
        },
        {
            q: "기존에 정해둔 이동 경로에 갑작스러운 변수가 생겼을 때?",
            a: { text: "원래 지침과 매뉴얼을 다시 점검하며 보수적으로 행동한다.", trait: "R" },
            b: { text: "순발력을 발휘해 그 자리에서 즉흥적으로 최선의 길을 선택한다.", trait: "F" }
        },
        {
            q: "새로운 사람이나 다른 강아지가 나에게 다가올 때?",
            a: { text: "반갑게 꼬리를 치며 친근하게 교감하고 인사를 나눈다.", trait: "P" },
            b: { text: "굳이 먼저 다가지 않고 차분히 내 영역과 페이스를 유지한다.", trait: "I" }
        },
        {
            q: "하루 일과를 마치고 집에서 쉴 때 더 좋아하는 스케줄은?",
            a: { text: "주인 옆에 꼭 붙어서 쓰다듬을 받으며 교감할 때", trait: "P" },
            b: { text: "내가 좋아하는 아늑한 명당에서 혼자 여유를 만끽할 때", trait: "I" }
        },
        {
            q: "열심히 일한 뒤 보상을 받을 때 더 힘이 나는 순간은?",
            a: { text: "주인이 나를 꼭 안아주고 다정하게 쓰다듬어줄 때", trait: "P" },
            b: { text: "내가 좋아하는 특식 간식과 방해받지 않는 자유 시간을 얻을 때", trait: "I" }
        },
        {
            q: "신나는 야외 활동이나 자유 시간이 주어졌을 때 나의 상태는?",
            a: { text: "활기차고 에너지 넘치게 온몸으로 뛰어놀 준비 완료!", trait: "E" },
            b: { text: "과하게 흥분하지 않고 조용하고 평온하게 주변을 즐김", trait: "C" }
        },
        {
            q: "미션 성공 후 맛있는 간식 보상을 받았을 때 표현 방식은?",
            a: { text: "기쁨을 참지 못해 점프하거나 온몸으로 신나게 표현한다.", trait: "E" },
            b: { text: "꼬리를 느긋하게 흔들며 차분하고 깊은 만족감을 표한다.", trait: "C" }
        },
        {
            q: "주변 분위기가 시끌벅적하고 아주 신나게 고조될 때 나의 반응은?",
            a: { text: "나도 같이 신나서 텐션이 올라가고 몸이 먼저 움직인다.", trait: "E" },
            b: { text: "한걸음 물러서서 차분하게 상황을 관망하며 평정심을 유지한다.", trait: "C" }
        }
    ];

    const results = {
        "RPE": {
            title: "🦮 열정 만렙 베테랑 리트리버",
            desc: "원칙을 철저히 지키면서도 사람과의 교감에 열정적인 에이스 안내견! 높은 책임감과 따뜻한 친화력으로 누구에게나 깊은 신뢰를 주는 리더 타입입니다."
        },
        "RPC": {
            title: "💛 다정다감 힐링 리트리버",
            desc: "규칙을 잘 지키며 차분하게 사람의 마음을 다독이는 따뜻한 힐러! 조용하지만 깊은 애정으로 주변 사람들에게 항상 평온과 위로를 전달합니다."
        },
        "RIE": {
            title: "🦉 브레인 해결사 리트리버",
            desc: "원칙을 바탕으로 빠르고 명석하게 상황을 판단하는 지능파! 독립적이면서도 에너지 넘치게 돌발 상황을 해결해내는 스마트한 파트너입니다."
        },
        "RIC": {
            title: "📐 철두철미 원칙주의 리트리버",
            desc: "조용하고 차분하게 주어진 임무와 약속을 100% 완수하는 신중파! 흔들림 없는 정석대로의 행동으로 가장 안정감을 주는 든든한 존재입니다."
        },
        "FPE": {
            title: "🎾 호기심 에너자이저 리트리버",
            desc: "틀에 매이지 않는 유연함과 사람을 좋아하는 사랑스러움이 더해진 활력소! 넘치는 에너지와 호기심으로 주변 모두를 미소 짓게 만듭니다."
        },
        "FPC": {
            title: "🐶 애교만점 껌딱지 리트리버",
            desc: "여유롭고 느긋하지만 주인 옆 1cm가 지정석인 해바라기! 따뜻하고 둥글둥글한 성격으로 보는 사람의 마음을 사르르 녹이는 사랑둥이입니다."
        },
        "FIE": {
            title: "🐾 엉뚱발랄 마이웨이 리트리버",
            desc: "자유로운 영혼과 통통 튀는 개성을 가진 탐색가! 자신만의 호기심을 따라 탐험하며 예상치 못한 엉뚱한 매력으로 즐거움을 줍니다."
        },
        "FIC": {
            title: "🥐 여유만만 긍정 미식가 리트리버",
            desc: "어떤 상황에서도 조급해하지 않는 긍정왕! 느긋하게 자유와 여유를 즐기며 나만의 행복을 찾아가는 평화로운 힐링 타입입니다."
        }
    };

    let currentIdx = 0;
    let scores = { R: 0, F: 0, P: 0, I: 0, E: 0, C: 0 };

    function startQuiz() {
        document.getElementById('start-page').classList.add('hidden');
        document.getElementById('quiz-page').classList.remove('hidden');
        showQuestion();
    }

    function showQuestion() {
        const q = questions[currentIdx];
        document.getElementById('question-number').innerText = `질문 ${currentIdx + 1} / ${questions.length}`;
        document.getElementById('question').innerText = q.q;
        document.getElementById('optA').innerText = q.a.text;
        document.getElementById('optB').innerText = q.b.text;
        document.getElementById('bar').style.width = (((currentIdx + 1) / questions.length) * 100) + '%';
    }

    function selectOption(option) {
        const q = questions[currentIdx];
        const selectedTrait = q[option.toLowerCase()].trait;
        scores[selectedTrait]++;

        currentIdx++;

        if (currentIdx < questions.length) {
            showQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById('quiz-page').classList.add('hidden');
        document.getElementById('result-page').classList.remove('hidden');

        // 3축 결과 계산 (축당 3개 질문이므로 동점 없이 2:1 이상으로 판별됨)
        const axis1 = scores.R > scores.F ? 'R' : 'F';
        const axis2 = scores.P > scores.I ? 'P' : 'I';
        const axis3 = scores.E > scores.C ? 'E' : 'C';

        const resultCode = axis1 + axis2 + axis3;
        const result = results[resultCode];

        document.getElementById('result-type').innerText = result.title;
        document.getElementById('result-desc').innerText = result.desc;
    }

    function resetQuiz() {
        currentIdx = 0;
        scores = { R: 0, F: 0, P: 0, I: 0, E: 0, C: 0 };
        document.getElementById('result-page').classList.add('hidden');
        document.getElementById('start-page').classList.remove('hidden');
    }
</script>
</body>
</html>
