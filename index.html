<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>안내견 리트리버 성격 테스트</title>
    <style>
        * { box-sizing: border-box; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
        body { background: #fdf8ed; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: white; width: 100%; max-width: 480px; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); text-align: center; }
        .hidden { display: none; }
        h1 { color: #d97706; font-size: 22px; margin-bottom: 15px; }
        .sub-title { color: #6b7280; font-size: 14px; margin-bottom: 25px; line-height: 1.5; }
        .btn { display: block; width: 100%; padding: 16px; margin: 10px 0; border: 2px solid #fef3c7; background: #fffbeb; border-radius: 14px; cursor: pointer; font-weight: 600; color: #92400e; font-size: 15px; transition: all 0.2s; line-height: 1.4; }
        .btn:hover { background: #fde68a; border-color: #f59e0b; }
        .progress { background: #f3f4f6; height: 10px; border-radius: 5px; margin-bottom: 25px; overflow: hidden; }
        .bar { background: #f59e0b; height: 100%; width: 0%; transition: width 0.3s; }
        .result-type { font-size: 22px; font-weight: bold; color: #b45309; margin: 20px 0 10px; }
        .badge { display: inline-block; background: #fef3c7; color: #d97706; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="card">
    <!-- 1. 시작 화면 -->
    <div id="start-page">
        <div style="font-size: 50px; margin-bottom: 10px;">🦮</div>
        <h1>나의 안내견 리트리버 유형은?</h1>
        <p class="sub-title">5가지 질문을 통해 나와 가장 닮은<br>안내견 리트리버 성격을 찾아보세요!</p>
        <button class="btn" style="background:#f59e0b; color:white; border:none; font-size:16px;" onclick="startQuiz()">테스트 시작하기</button>
    </div>

    <!-- 2. 질문 화면 -->
    <div id="quiz-page" class="hidden">
        <div class="progress"><div id="bar" class="bar"></div></div>
        <div id="question-number" class="badge">질문 1 / 5</div>
        <h2 id="question" style="font-size: 18px; color: #1f2937; min-height: 55px; margin-top:0;">질문 내용</h2>
        <button class="btn" onclick="selectOption('A')" id="optA">선택지 A</button>
        <button class="btn" onclick="selectOption('B')" id="optB">선택지 B</button>
    </div>

    <!-- 3. 결과 화면 -->
    <div id="result-page" class="hidden">
        <div class="badge">YOUR TYPE</div>
        <h1>🐾 나의 리트리버 성격 결과</h1>
        <div id="result-type" class="result-type">결과 유형</div>
        <p id="result-desc" style="color: #4b5563; line-height: 1.6; font-size: 15px; word-break: keep-all;"></p>
        <button class="btn" style="background:#f59e0b; color:white; border:none; margin-top:25px;" onclick="resetQuiz()">다시 테스트하기</button>
    </div>
</div>

<script>
    const questions = [
        {
            q: "산책 중 처음 보는 사람이 반갑게 인사를 건넬 때 당신은?",
            a: { text: "꼬리를 치며 반갑게 다가가 친밀감을 표시한다.", scores: { healer: 2, clingy: 2, curious: 1 } },
            b: { text: "주인의 보폭과 걸음에 맞춰 차분하게 이동에 집중한다.", scores: { veteran: 2, fm: 2, myway: 1 } }
        },
        {
            q: "새로운 공원이나 낯선 장소에 도착했을 때 당신의 반응은?",
            a: { text: "호기심을 갖고 신나게 구석구석 냄새를 맡으며 탐색한다.", scores: { curious: 2, myway: 2, healer: 1 } },
            b: { text: "주인이 지시하는 안전한 동선을 따라 신중하게 행동한다.", scores: { veteran: 2, fm: 2, clingy: 1 } }
        },
        {
            q: "집에서 자유 시간이 생겼을 때 더 선호하는 행동은?",
            a: { text: "주인 옆에 딱 붙어서 쓰다듬을 받거나 같이 놀기", scores: { clingy: 2, healer: 2, curious: 1 } },
            b: { text: "내가 좋아하는 나만의 명당에 누워 여유롭게 휴식하기", scores: { myway: 2, fm: 2, veteran: 1 } }
        },
        {
            q: "길을 가다가 예상치 못한 장애물이나 돌발 상황을 만나면?",
            a: { text: "당황하지 않고 배웠던 대로 안전한 우회로를 찾는다.", scores: { veteran: 2, fm: 2, healer: 1 } },
            b: { text: "잠시 멈춰 서서 '이건 뭐지?' 하고 호기심 어린 눈으로 관찰한다.", scores: { curious: 2, myway: 2, clingy: 1 } }
        },
        {
            q: "미션을 멋지게 성공하고 주인의 따뜻한 칭찬을 받았을 때 마음은?",
            a: { text: "칭찬받아서 너무 행복해! 온몸으로 기쁨을 표현한다.", scores: { healer: 2, clingy: 2, curious: 1 } },
            b: { text: "역시 완벽했군! 뿌듯함을 느끼며 다음 미션을 준비한다.", scores: { veteran: 2, fm: 2, myway: 1 } }
        }
    ];

    const results = {
        veteran: {
            title: "🦮 베테랑 완벽주의 안내견",
            desc: "집중력과 사명감이 넘치는 안내견계의 에이스! 어떤 상황에서도 주인을 안전하게 인도하는 신뢰도 200%의 리더 타입입니다."
        },
        curious: {
            title: "🎾 호기심 에너자이저 리트리버",
            desc: "세상은 넓고 재미있는 건 많다! 넘치는 호기심과 밝은 에너지로 주변 모두에게 즐거움을 전하는 유쾌한 활력소입니다."
        },
        healer: {
            title: "💛 다정다감 힐링 리트리버",
            desc: "상대의 감정을 누구보다 잘 읽어내는 따뜻한 마음의 소유자! 존재 자체만으로 주변 사람들에게 큰 위로와 평온을 줍니다."
        },
        myway: {
            title: "🐾 엉뚱발랄 마이웨이 리트리버",
            desc: "자유로운 영혼과 개성을 가진 유일무이 타입! 가끔은 엉뚱해서 웃음을 주지만 결코 미워할 수 없는 매력 덩어리입니다."
        },
        fm: {
            title: "📐 철두철미 원칙주의 리트리버",
            desc: "약속과 규칙, 계획이 가장 중요한 FM 파트너! 신중하고 책임감이 강해 언제 어디서나 의지할 수 있는 든든한 존재입니다."
        },
        clingy: {
            title: "🐶 애교만점 껌딱지 리트리버",
            desc: "소중한 사람 옆 1cm가 나의 지정석! 순수하고 애정 표현에 솔직하여 보는 사람의 마음을 녹여버리는 넘치는 사랑둥이입니다."
        }
    };

    let currentIdx = 0;
    let scores = { veteran: 0, curious: 0, healer: 0, myway: 0, fm: 0, clingy: 0 };

    function startQuiz() {
        document.getElementById('start-page').classList.add('hidden');
        document.getElementById('quiz-page').classList.remove('hidden');
        showQuestion();
    }

    function showQuestion() {
        const q = questions[currentIdx];
        document.getElementById('question-number').innerText = `질문 ${currentIdx + 1} / ${questions.length}`;
        document.getElementById('question').innerText = q.q;
        document.getElementById('optA').innerText = q.a.text;
        document.getElementById('optB').innerText = q.b.text;
        document.getElementById('bar').style.width = (((currentIdx + 1) / questions.length) * 100) + '%';
    }

    function selectOption(option) {
        const q = questions[currentIdx];
        const selectedScores = q[option.toLowerCase()].scores;

        for (let key in selectedScores) {
            scores[key] += selectedScores[key];
        }

        currentIdx++;

        if (currentIdx < questions.length) {
            showQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById('quiz-page').classList.add('hidden');
        document.getElementById('result-page').classList.remove('hidden');

        let maxType = 'veteran';
        let maxScore = -1;

        for (let type in scores) {
            if (scores[type] > maxScore) {
                maxScore = scores[type];
                maxType = type;
            }
        }

        const result = results[maxType];
        document.getElementById('result-type').innerText = result.title;
        document.getElementById('result-desc').innerText = result.desc;
    }

    function resetQuiz() {
        currentIdx = 0;
        scores = { veteran: 0, curious: 0, healer: 0, myway: 0, fm: 0, clingy: 0 };
        document.getElementById('result-page').classList.add('hidden');
        document.getElementById('start-page').classList.remove('hidden');
    }
</script>
</body>
</html>
